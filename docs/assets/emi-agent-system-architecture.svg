<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">EMI-Agent current public implementation architecture and data flow</title>
  <desc id="desc">A layered public implementation of EMI-Agent: React, FastAPI, LangGraph GraphState, read-only tools, providers, SQLite checkpoints, SSE return flow, reviewer feedback and engineer confirmation.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/></marker>
    <style>
      .title { font: 700 30px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 16px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#475569; }
      .layer { font: 700 14px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#334155; letter-spacing:1px; }
      .node-title { font: 700 17px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#0f172a; }
      .node-body { font: 400 13px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#475569; }
      .small { font: 600 12px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#64748b; }
      .label { font: 600 12px 'Segoe UI','Microsoft YaHei',Arial,sans-serif; fill:#0f766e; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; }
      .input { fill:#e8f1ff; stroke:#3b82f6; stroke-width:1.5; }
      .role { fill:#f3f4f6; stroke:#64748b; stroke-width:1.2; }
      .state { fill:#ecfdf5; stroke:#10b981; stroke-width:1.5; }
      .infra { fill:#fff7ed; stroke:#f97316; stroke-width:1.5; }
      .line { fill:none; stroke:#3b82f6; stroke-width:2; marker-end:url(#arrow-blue); }
      .stream { fill:none; stroke:#3b82f6; stroke-width:1.7; stroke-dasharray:6 5; marker-end:url(#arrow-blue); }
      .state-line { fill:none; stroke:#10b981; stroke-width:1.7; stroke-dasharray:6 5; marker-end:url(#arrow-green); }
      .feedback { fill:none; stroke:#f97316; stroke-width:2; stroke-dasharray:7 5; marker-end:url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>
  <text x="60" y="58" class="title">EMI-Agent 当前公开实现：系统架构与数据流</text>
  <text x="60" y="86" class="subtitle">React / FastAPI / LangGraph / 工具与状态持久化的分层实现</text>

  <rect x="45" y="120" width="1510" height="170" rx="16" class="panel"/>
  <text x="70" y="150" class="layer">01 · 交互与应用服务层</text>
  <g transform="translate(90 176)">
    <rect width="260" height="82" rx="12" class="input"/>
    <text x="20" y="31" class="node-title">React / Vite</text>
    <text x="20" y="54" class="node-body">任务发起 · 轨迹展示 · 工程师确认</text>
  </g>
  <path d="M350 217 H440" class="line"/>
  <g transform="translate(440 176)">
    <rect width="300" height="82" rx="12" class="input"/>
    <text x="20" y="31" class="node-title">FastAPI API</text>
    <text x="20" y="54" class="node-body">runs / resume / decision / health</text>
  </g>
  <path d="M740 217 H830" class="line"/>
  <g transform="translate(830 176)">
    <rect width="300" height="82" rx="12" class="infra"/>
    <text x="20" y="31" class="node-title">GraphManager / SSE runtime</text>
    <text x="20" y="54" class="node-body">启动、恢复、事件封装与流式返回</text>
  </g>
  <path d="M1130 217 H1220" class="line"/>
  <g transform="translate(1220 176)">
    <rect width="260" height="82" rx="12" class="state"/>
    <text x="20" y="31" class="node-title">SSE trajectory</text>
    <text x="20" y="54" class="node-body">节点事件、工具结果、审核状态</text>
  </g>
  <path d="M1350 258 V278 H220 V258" class="stream"/>

  <rect x="45" y="320" width="1510" height="355" rx="16" class="panel"/>
  <text x="70" y="350" class="layer">02 · LangGraph 工作流（当前公开实现）</text>
  <text x="70" y="374" class="small">蓝色实线：执行与调用；橙色虚线：Reviewer 问题单触发的定向重执行；绿色虚线：GraphState 部分读写</text>

  <g transform="translate(85 418)">
    <rect width="190" height="104" rx="12" class="role"/>
    <text x="18" y="32" class="node-title">Planner</text>
    <text x="18" y="56" class="node-body">目标 · 信息缺口</text>
    <text x="18" y="77" class="node-body">步骤依赖 · 完成条件</text>
  </g>
  <path d="M275 470 H330" class="line"/>
  <g transform="translate(330 398)">
    <rect width="250" height="144" rx="12" class="role"/>
    <text x="18" y="32" class="node-title">Evidence workers</text>
    <text x="18" y="57" class="node-body">LangGraph Send 并行分发</text>
    <text x="18" y="78" class="node-body">测量 · 频率 · 整改 · 耦合</text>
    <text x="18" y="108" class="small">baseline：串行执行</text>
  </g>
  <path d="M580 470 H635" class="line"/>
  <g transform="translate(635 418)">
    <rect width="200" height="104" rx="12" class="role"/>
    <text x="18" y="32" class="node-title">Diagnosis</text>
    <text x="18" y="56" class="node-body">候选原因与证据汇总</text>
    <text x="18" y="77" class="node-body">验证建议</text>
  </g>
  <path d="M835 470 H890" class="line"/>
  <g transform="translate(890 418)">
    <rect width="200" height="104" rx="12" class="role"/>
    <text x="18" y="32" class="node-title">Reviewer</text>
    <text x="18" y="56" class="node-body">证据缺口 · 冲突</text>
    <text x="18" y="77" class="node-body">越界结论检查</text>
  </g>
  <path d="M1090 470 H1145" class="line"/>
  <g transform="translate(1145 418)">
    <rect width="185" height="104" rx="12" class="role"/>
    <text x="18" y="32" class="node-title">Reporter</text>
    <text x="18" y="56" class="node-body">确定性报告格式化</text>
    <text x="18" y="77" class="node-body">needs_human_review</text>
  </g>
  <path d="M1330 470 H1385" class="line"/>
  <g transform="translate(1385 418)">
    <rect width="125" height="104" rx="12" class="input"/>
    <text x="18" y="32" class="node-title">Engineer</text>
    <text x="18" y="56" class="node-body">确认</text>
    <text x="18" y="77" class="node-body">修改 / 驳回</text>
  </g>

  <path d="M990 522 V580 H455 V542" class="feedback"/>
  <text x="675" y="570" class="label">结构化问题单：仅返回责任节点，最多三轮受限返工</text>

  <g transform="translate(430 580)">
    <rect width="520" height="62" rx="12" class="state"/>
    <text x="20" y="27" class="node-title">GraphState</text>
    <text x="145" y="27" class="node-body">计划 · 证据 · Diagnosis · Review · trajectory · metrics</text>
    <text x="20" y="49" class="node-body">节点返回部分状态更新，通过 reducer 和稳定 operation ID 合并</text>
  </g>
  <path d="M180 522 V 610 H430" class="state-line"/>
  <path d="M455 542 V 580" class="state-line"/>
  <path d="M735 522 V 580" class="state-line"/>
  <path d="M990 522 V 580" class="state-line"/>
  <path d="M1237 522 V 580" class="state-line"/>

  <rect x="45" y="705" width="1510" height="185" rx="16" class="panel"/>
  <text x="70" y="735" class="layer">03 · 工具、状态持久化与模型服务</text>
  <g transform="translate(90 770)">
    <rect width="315" height="82" rx="12" class="state"/>
    <text x="20" y="31" class="node-title">只读白名单工具</text>
    <text x="20" y="54" class="node-body">测量查询 · 频率匹配 · 整改对比 · 耦合路径 · 一致性校验</text>
  </g>
  <g transform="translate(485 770)">
    <rect width="250" height="82" rx="12" class="state"/>
    <text x="20" y="31" class="node-title">公开合成案例与工具数据</text>
    <text x="20" y="54" class="node-body">case data / fixture data</text>
  </g>
  <g transform="translate(815 770)">
    <rect width="260" height="82" rx="12" class="infra"/>
    <text x="20" y="31" class="node-title">SQLite checkpoint</text>
    <text x="20" y="54" class="node-body">运行记录 · checkpoint · resume</text>
  </g>
  <g transform="translate(1155 770)">
    <rect width="315" height="82" rx="12" class="role"/>
    <text x="20" y="31" class="node-title">Model provider</text>
    <text x="20" y="54" class="node-body">FixtureReplayProvider / DashScopeProvider</text>
  </g>
  <path d="M455 542 V 715 H247 V770" class="state-line"/>
  <path d="M247 811 H485" class="state-line"/>
  <path d="M980 258 V320" class="line"/>
  <path d="M1110 258 V720 H945 V770" class="line"/>
</svg>
