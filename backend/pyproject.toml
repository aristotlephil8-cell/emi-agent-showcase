[project]
name = "emi-agent-backend"
version = "0.1.0"
description = "Evidence-grounded multi-agent assistant for synthetic EMI diagnosis demos."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sse-starlette>=3.0,<4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "anyio>=4.9,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
